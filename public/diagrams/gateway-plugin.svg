<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 902 394" width="902" role="img" aria-label="Gateway plugin flow">
<title>Gateway plugin flow</title>
<style>.dg{--k-ink:#18181b;--k-mut:#5b5b63;--k-line:#71717a;--k-bg:#ffffff;--k-box:#ffffff;--k-bs:#b9b9b3;--k-grp:#f4f4f2;--k-gs:#c4c4be;--k-acc:#eef2ff;--k-as:#4f46e5;--k-ok:#dcfce7;--k-os:#16a34a;--k-warn:#fef3c7;--k-ws:#d97706;--k-bad:#fef2f2;--k-bds:#dc2626}
@media (prefers-color-scheme:dark){.dg{--k-ink:#ededef;--k-mut:#a1a1aa;--k-line:#8b8b96;--k-bg:#18181b;--k-box:#202024;--k-bs:#52525b;--k-grp:#141417;--k-gs:#3f3f46;--k-acc:rgba(129,140,248,.14);--k-as:#818cf8;--k-ok:rgba(34,197,94,.14);--k-os:#4ade80;--k-warn:rgba(245,158,11,.14);--k-ws:#fbbf24;--k-bad:rgba(239,68,68,.14);--k-bds:#f87171}}
.dg text{font-family:var(--font-geist-sans),Geist,system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--k-ink);font-size:12.5px}
.dg .dg-p{font-weight:560}
.dg .dg-s{fill:var(--k-mut);font-size:11px}
.dg .dg-l{fill:var(--k-mut);font-size:11.5px}
.dg .dg-h{paint-order:stroke;stroke:var(--k-bg);stroke-width:5px;stroke-linejoin:round}
.dg .dg-n{fill:var(--k-as);font-weight:650}
.dg .dg-gt{fill:var(--k-mut);font-size:11px;font-weight:560;letter-spacing:.02em}
.dg .dg-box{fill:var(--k-box);stroke:var(--k-bs);stroke-width:1.2}
.dg .dg-acc{fill:var(--k-acc);stroke:var(--k-as)}
.dg .dg-ok{fill:var(--k-ok);stroke:var(--k-os)}
.dg .dg-warn{fill:var(--k-warn);stroke:var(--k-ws)}
.dg .dg-bad{fill:var(--k-bad);stroke:var(--k-bds)}
.dg .dg-grp{fill:var(--k-grp);stroke:var(--k-gs);stroke-width:1.2;stroke-dasharray:6 4}
.dg .dg-ln{fill:none;stroke:var(--k-line);stroke-width:1.3}
.dg .dg-dash{stroke-dasharray:6 4}
.dg .dg-life{stroke:var(--k-gs);stroke-width:1.2;stroke-dasharray:3 4}
.dg .dg-mk{fill:var(--k-line)}
.dg .dg-dot{fill:var(--k-line)}
.dg .dg-bar{stroke-width:1.2}
.dg .dg-tick{stroke:var(--k-line);stroke-width:1.2}
.dg .dg-guide{stroke:var(--k-gs);stroke-width:1.2;stroke-dasharray:3 4}</style>
<defs><marker id="ar-gw" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-mk" d="M0,0 L8,4 L0,8 L2,4 z"/></marker></defs>
<rect class="dg-grp" x="20" y="20" width="210" height="170" rx="10"/>
<text class="dg-gt" x="32" y="36">Your Frappe app</text>
<path class="dg-ln" d="M215,68 C 260,68 270,96 299,96" marker-end="url(#ar-gw)"/>
<path class="dg-ln" d="M215,144 C 260,144 270,118 299,118" marker-end="url(#ar-gw)"/>
<path class="dg-ln" d="M525,107 L579,107" marker-end="url(#ar-gw)"/>
<path class="dg-ln" d="M185,276 L197,276" marker-end="url(#ar-gw)"/>
<path class="dg-ln" d="M363,276 L375,276" marker-end="url(#ar-gw)"/>
<path class="dg-ln" d="M561,276 L573,276" marker-end="url(#ar-gw)"/>
<path class="dg-ln" d="M719,276 L731,276" marker-end="url(#ar-gw)"/>
<path class="dg-ln" d="M283,308 L283,323" marker-end="url(#ar-gw)"/>
<path class="dg-ln" d="M807,245 C 807,205 415,215 415,149" marker-end="url(#ar-gw)"/>
<!-- class MyGateway(Gateway): x=40 y=44 right=210 bottom=92 -->
<rect class="dg-box" x="40" y="44" width="170" height="48" rx="7"/>
<text class="dg-p" x="125" y="64.5" text-anchor="middle">class MyGateway(Gateway)</text>
<text class="dg-s" x="125" y="79.5" text-anchor="middle">name, supports</text>
<!-- hooks.py: x=40 y=120 right=210 bottom=168 -->
<rect class="dg-box" x="40" y="120" width="170" height="48" rx="7"/>
<text class="dg-p" x="125" y="140.5" text-anchor="middle">hooks.py</text>
<text class="dg-s" x="125" y="155.5" text-anchor="middle">saas_core_gateways</text>
<!-- registry.get_gateway(name): x=310 y=76 right=520 bottom=138 -->
<rect class="dg-acc" x="310" y="76" width="210" height="62" rx="7"/>
<text class="dg-p" x="415" y="96" text-anchor="middle">registry.get_gateway(name)</text>
<text class="dg-s" x="415" y="111" text-anchor="middle">experimental gate ·</text>
<text class="dg-s" x="415" y="126" text-anchor="middle">Gateway Account</text>
<!-- checkout.create_session: x=590 y=81 right=760 bottom=133 -->
<rect class="dg-box" x="590" y="81" width="170" height="52" rx="7"/>
<text class="dg-p" x="675" y="111" text-anchor="middle">checkout.create_session</text>
<text class="dg-l" x="257" y="58" text-anchor="middle">implements</text>
<text class="dg-l" x="257" y="170" text-anchor="middle">registers</text>
<!-- webhooks.receive: x=20 y=250 right=180 bottom=302 -->
<rect class="dg-box" x="20" y="250" width="160" height="52" rx="7"/>
<text class="dg-p" x="100" y="272.5" text-anchor="middle">webhooks.receive</text>
<text class="dg-s" x="100" y="287.5" text-anchor="middle">?gateway=name</text>
<polygon class="dg-warn" points="224,249 342,249 358,276 342,303 224,303 208,276" stroke-linejoin="round"/>
<text class="dg-p" x="283" y="272.5" text-anchor="middle">verify_webhook</text>
<text class="dg-s" x="283" y="287.5" text-anchor="middle">raw bytes, HMAC</text>
<!-- parse_event →: x=386 y=250 right=556 bottom=302 -->
<rect class="dg-box" x="386" y="250" width="170" height="52" rx="7"/>
<text class="dg-p" x="471" y="272.5" text-anchor="middle">parse_event →</text>
<text class="dg-s" x="471" y="287.5" text-anchor="middle">NormalizedEvent</text>
<!-- Payment Event: x=584 y=250 right=714 bottom=302 -->
<rect class="dg-box" x="584" y="250" width="130" height="52" rx="7"/>
<text class="dg-p" x="649" y="272.5" text-anchor="middle">Payment Event</text>
<text class="dg-s" x="649" y="287.5" text-anchor="middle">gateway:event_id</text>
<!-- billing processor: x=742 y=250 right=872 bottom=302 -->
<rect class="dg-ok" x="742" y="250" width="130" height="52" rx="7"/>
<text class="dg-p" x="807" y="280" text-anchor="middle">billing processor</text>
<text class="dg-l" x="372" y="264" text-anchor="middle">true</text>
<!-- 401: x=238 y=334 right=308 bottom=374 -->
<rect class="dg-bad" x="238" y="334" width="70" height="40" rx="7"/>
<text class="dg-p" x="273" y="358" text-anchor="middle">401</text>
<text class="dg-l" x="293" y="322" text-anchor="start">false</text>
<text class="dg-l" x="615" y="190" text-anchor="middle">refund (if supports)</text>
</svg>
