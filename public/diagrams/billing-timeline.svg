<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 751 270" width="751" role="img" aria-label="Billing timeline for the cancel example">
<title>Billing timeline for the cancel example</title>
<style>.dg{--k-ink:#18181b;--k-mut:#5b5b63;--k-line:#71717a;--k-bg:#ffffff;--k-box:#ffffff;--k-bs:#b9b9b3;--k-grp:#f4f4f2;--k-gs:#c4c4be;--k-acc:#eef2ff;--k-as:#4f46e5;--k-ok:#dcfce7;--k-os:#16a34a;--k-warn:#fef3c7;--k-ws:#d97706;--k-bad:#fef2f2;--k-bds:#dc2626}
@media (prefers-color-scheme:dark){.dg{--k-ink:#ededef;--k-mut:#a1a1aa;--k-line:#8b8b96;--k-bg:#18181b;--k-box:#202024;--k-bs:#52525b;--k-grp:#141417;--k-gs:#3f3f46;--k-acc:rgba(129,140,248,.14);--k-as:#818cf8;--k-ok:rgba(34,197,94,.14);--k-os:#4ade80;--k-warn:rgba(245,158,11,.14);--k-ws:#fbbf24;--k-bad:rgba(239,68,68,.14);--k-bds:#f87171}}
.dg text{font-family:var(--font-geist-sans),Geist,system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--k-ink);font-size:12.5px}
.dg .dg-p{font-weight:560}
.dg .dg-s{fill:var(--k-mut);font-size:11px}
.dg .dg-l{fill:var(--k-mut);font-size:11.5px}
.dg .dg-h{paint-order:stroke;stroke:var(--k-bg);stroke-width:5px;stroke-linejoin:round}
.dg .dg-n{fill:var(--k-as);font-weight:650}
.dg .dg-gt{fill:var(--k-mut);font-size:11px;font-weight:560;letter-spacing:.02em}
.dg .dg-box{fill:var(--k-box);stroke:var(--k-bs);stroke-width:1.2}
.dg .dg-acc{fill:var(--k-acc);stroke:var(--k-as)}
.dg .dg-ok{fill:var(--k-ok);stroke:var(--k-os)}
.dg .dg-warn{fill:var(--k-warn);stroke:var(--k-ws)}
.dg .dg-bad{fill:var(--k-bad);stroke:var(--k-bds)}
.dg .dg-grp{fill:var(--k-grp);stroke:var(--k-gs);stroke-width:1.2;stroke-dasharray:6 4}
.dg .dg-ln{fill:none;stroke:var(--k-line);stroke-width:1.3}
.dg .dg-dash{stroke-dasharray:6 4}
.dg .dg-life{stroke:var(--k-gs);stroke-width:1.2;stroke-dasharray:3 4}
.dg .dg-mk{fill:var(--k-line)}
.dg .dg-dot{fill:var(--k-line)}
.dg .dg-bar{stroke-width:1.2}
.dg .dg-tick{stroke:var(--k-line);stroke-width:1.2}
.dg .dg-guide{stroke:var(--k-gs);stroke-width:1.2;stroke-dasharray:3 4}</style>
<defs><marker id="ar-bill" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-mk" d="M0,0 L8,4 L0,8 L2,4 z"/></marker></defs>
<line class="dg-guide" x1="260" y1="62" x2="260" y2="204"/>
<line class="dg-guide" x1="701" y1="62" x2="701" y2="204"/>
<path class="dg-bad" d="M260,50 L268,58 L260,66 L252,58 z" stroke-width="1.2"/>
<path class="dg-box" d="M701,50 L709,58 L701,66 L693,58 z" stroke-width="1.2"/>
<text class="dg-l" x="260" y="15" text-anchor="middle">Cancel on 10 Mar</text>
<text class="dg-l" x="260" y="28" text-anchor="middle">site runs to midnight</text>
<text class="dg-l" x="701" y="15" text-anchor="end">1 Apr</text>
<text class="dg-l" x="701" y="28" text-anchor="end">renewal not charged</text>
<!-- Prepaid 1 Mar to 1 Apr: ₹2,999, 31 days: x=50 y=92 right=701 bottom=132 -->
<rect class="dg-acc" x="50" y="92" width="651" height="40" rx="7"/>
<text class="dg-p" x="375.5" y="116" text-anchor="middle">Prepaid 1 Mar to 1 Apr: ₹2,999, 31 days</text>
<!-- Used 10 days: x=50 y=160 right=260 bottom=200 -->
<rect class="dg-ok" x="50" y="160" width="210" height="40" rx="7"/>
<text class="dg-p" x="155" y="176.5" text-anchor="middle">Used 10 days</text>
<text class="dg-s" x="155" y="191.5" text-anchor="middle">₹967.42</text>
<!-- Unused 11 to 31 Mar, 21 days: x=260 y=160 right=701 bottom=200 -->
<rect class="dg-bad" x="260" y="160" width="441" height="40" rx="7"/>
<text class="dg-p" x="480.5" y="176.5" text-anchor="middle">Unused 11 to 31 Mar, 21 days</text>
<text class="dg-s" x="480.5" y="191.5" text-anchor="middle">refund ₹2,031.58</text>
<line class="dg-tick" x1="50" y1="224" x2="701" y2="224"/>
<line class="dg-tick" x1="50" y1="224" x2="50" y2="229"/>
<text class="dg-l dg-s" x="50" y="244" text-anchor="middle">1 Mar</text>
<line class="dg-tick" x1="155" y1="224" x2="155" y2="229"/>
<text class="dg-l dg-s" x="155" y="244" text-anchor="middle">6 Mar</text>
<line class="dg-tick" x1="260" y1="224" x2="260" y2="229"/>
<text class="dg-l dg-s" x="260" y="244" text-anchor="middle">11 Mar</text>
<line class="dg-tick" x1="365" y1="224" x2="365" y2="229"/>
<text class="dg-l dg-s" x="365" y="244" text-anchor="middle">16 Mar</text>
<line class="dg-tick" x1="470" y1="224" x2="470" y2="229"/>
<text class="dg-l dg-s" x="470" y="244" text-anchor="middle">21 Mar</text>
<line class="dg-tick" x1="575" y1="224" x2="575" y2="229"/>
<text class="dg-l dg-s" x="575" y="244" text-anchor="middle">26 Mar</text>
<line class="dg-tick" x1="701" y1="224" x2="701" y2="229"/>
<text class="dg-l dg-s" x="701" y="244" text-anchor="middle">1 Apr</text>
</svg>
