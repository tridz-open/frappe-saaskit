<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 810 292" width="810" role="img" aria-label="Frappe SaaS architecture">
<title>Frappe SaaS architecture</title>
<style>.dg{--k-ink:#18181b;--k-mut:#5b5b63;--k-line:#71717a;--k-bg:#ffffff;--k-box:#ffffff;--k-bs:#b9b9b3;--k-grp:#f4f4f2;--k-gs:#c4c4be;--k-acc:#eef2ff;--k-as:#4f46e5;--k-ok:#dcfce7;--k-os:#16a34a;--k-warn:#fef3c7;--k-ws:#d97706;--k-bad:#fef2f2;--k-bds:#dc2626}
@media (prefers-color-scheme:dark){.dg{--k-ink:#ededef;--k-mut:#a1a1aa;--k-line:#8b8b96;--k-bg:#18181b;--k-box:#202024;--k-bs:#52525b;--k-grp:#141417;--k-gs:#3f3f46;--k-acc:rgba(129,140,248,.14);--k-as:#818cf8;--k-ok:rgba(34,197,94,.14);--k-os:#4ade80;--k-warn:rgba(245,158,11,.14);--k-ws:#fbbf24;--k-bad:rgba(239,68,68,.14);--k-bds:#f87171}}
.dg text{font-family:var(--font-geist-sans),Geist,system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--k-ink);font-size:12.5px}
.dg .dg-p{font-weight:560}
.dg .dg-s{fill:var(--k-mut);font-size:11px}
.dg .dg-l{fill:var(--k-mut);font-size:11.5px}
.dg .dg-h{paint-order:stroke;stroke:var(--k-bg);stroke-width:5px;stroke-linejoin:round}
.dg .dg-n{fill:var(--k-as);font-weight:650}
.dg .dg-gt{fill:var(--k-mut);font-size:11px;font-weight:560;letter-spacing:.02em}
.dg .dg-box{fill:var(--k-box);stroke:var(--k-bs);stroke-width:1.2}
.dg .dg-acc{fill:var(--k-acc);stroke:var(--k-as)}
.dg .dg-ok{fill:var(--k-ok);stroke:var(--k-os)}
.dg .dg-warn{fill:var(--k-warn);stroke:var(--k-ws)}
.dg .dg-bad{fill:var(--k-bad);stroke:var(--k-bds)}
.dg .dg-grp{fill:var(--k-grp);stroke:var(--k-gs);stroke-width:1.2;stroke-dasharray:6 4}
.dg .dg-ln{fill:none;stroke:var(--k-line);stroke-width:1.3}
.dg .dg-dash{stroke-dasharray:6 4}
.dg .dg-life{stroke:var(--k-gs);stroke-width:1.2;stroke-dasharray:3 4}
.dg .dg-mk{fill:var(--k-line)}
.dg .dg-dot{fill:var(--k-line)}
.dg .dg-bar{stroke-width:1.2}
.dg .dg-tick{stroke:var(--k-line);stroke-width:1.2}
.dg .dg-guide{stroke:var(--k-gs);stroke-width:1.2;stroke-dasharray:3 4}</style>
<defs><marker id="ar-arch" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path class="dg-mk" d="M0,0 L8,4 L0,8 L2,4 z"/></marker></defs>
<rect class="dg-grp" x="305" y="20" width="180" height="252" rx="10"/>
<text class="dg-gt" x="317" y="36">Your server</text>
<rect class="dg-grp" x="590" y="20" width="200" height="252" rx="10"/>
<text class="dg-gt" x="602" y="36">Frappe Cloud v2</text>
<path class="dg-ln" d="M100,103 L100,115" marker-end="url(#ar-arch)"/>
<path class="dg-ln" d="M185,150 L314,150" marker-end="url(#ar-arch)"/>
<path class="dg-ln" d="M185,216 L314,216" marker-end="url(#ar-arch)"/>
<path class="dg-ln" d="M320,236 L191,236" marker-end="url(#ar-arch)"/>
<path class="dg-ln" d="M395,121 L395,109" marker-end="url(#ar-arch)"/>
<path class="dg-ln" d="M470,74 L599,74" marker-end="url(#ar-arch)"/>
<path class="dg-ln" d="M470,74 C 530,74 550,150 599,150" marker-end="url(#ar-arch)"/>
<path class="dg-ln" d="M643,179 L643,191" marker-end="url(#ar-arch)"/>
<path class="dg-ln" d="M737,179 L737,191" marker-end="url(#ar-arch)"/>
<!-- Browser: x=20 y=50 right=180 bottom=98 -->
<rect class="dg-box" x="20" y="50" width="160" height="48" rx="7"/>
<text class="dg-p" x="100" y="78" text-anchor="middle">Browser</text>
<!-- Starter: x=20 y=126 right=180 bottom=174 -->
<rect class="dg-box" x="20" y="126" width="160" height="48" rx="7"/>
<text class="dg-p" x="100" y="146.5" text-anchor="middle">Starter</text>
<text class="dg-s" x="100" y="161.5" text-anchor="middle">React + SDK</text>
<!-- Payment gateway: x=20 y=202 right=180 bottom=250 -->
<rect class="dg-warn" x="20" y="202" width="160" height="48" rx="7"/>
<text class="dg-p" x="100" y="222.5" text-anchor="middle">Payment gateway</text>
<text class="dg-s" x="100" y="237.5" text-anchor="middle">Razorpay · Stripe · yours</text>
<!-- fcctl: x=325 y=50 right=465 bottom=98 -->
<rect class="dg-acc" x="325" y="50" width="140" height="48" rx="7"/>
<text class="dg-p" x="395" y="70.5" text-anchor="middle">fcctl</text>
<text class="dg-s" x="395" y="85.5" text-anchor="middle">CLI + library</text>
<!-- saas_core: x=325 y=126 right=465 bottom=250 -->
<rect class="dg-acc" x="325" y="126" width="140" height="124" rx="7"/>
<text class="dg-p" x="395" y="184.5" text-anchor="middle">saas_core</text>
<text class="dg-s" x="395" y="199.5" text-anchor="middle">control-plane site</text>
<!-- Central: x=610 y=50 right=770 bottom=98 -->
<rect class="dg-box" x="610" y="50" width="160" height="48" rx="7"/>
<text class="dg-p" x="690" y="70.5" text-anchor="middle">Central</text>
<text class="dg-s" x="690" y="85.5" text-anchor="middle">team · servers · buckets</text>
<!-- Pilot: x=610 y=126 right=770 bottom=174 -->
<rect class="dg-box" x="610" y="126" width="160" height="48" rx="7"/>
<text class="dg-p" x="690" y="146.5" text-anchor="middle">Pilot</text>
<text class="dg-s" x="690" y="161.5" text-anchor="middle">sites · apps · backups</text>
<!-- Tenant: x=610 y=202 right=676 bottom=250 -->
<rect class="dg-ok" x="610" y="202" width="66" height="48" rx="7"/>
<text class="dg-p" x="643" y="222.5" text-anchor="middle">Tenant</text>
<text class="dg-s" x="643" y="237.5" text-anchor="middle">site A</text>
<!-- Tenant: x=704 y=202 right=770 bottom=250 -->
<rect class="dg-ok" x="704" y="202" width="66" height="48" rx="7"/>
<text class="dg-p" x="737" y="222.5" text-anchor="middle">Tenant</text>
<text class="dg-s" x="737" y="237.5" text-anchor="middle">site B</text>
<text class="dg-l" x="110" y="117" text-anchor="start">visits</text>
<text class="dg-l" x="242" y="122" text-anchor="middle">HTTPS JSON</text>
<text class="dg-l" x="242" y="135" text-anchor="middle">API 2.0.0-alpha.1</text>
<text class="dg-l" x="242" y="204" text-anchor="middle">webhooks</text>
<text class="dg-l" x="242" y="254" text-anchor="middle">checkout session</text>
<text class="dg-l" x="405" y="117" text-anchor="start">fcctl port</text>
<text class="dg-l" x="537" y="62" text-anchor="middle">Central API</text>
<text class="dg-l" x="537" y="140" text-anchor="middle">Pilot API</text>
<text class="dg-l" x="690" y="193" text-anchor="middle">hosts</text>
</svg>
