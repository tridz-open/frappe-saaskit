<text class="dg-l" x="691" y="191" text-anchor="middle">delete</text>
<text class="dg-l" x="691" y="204" text-anchor="middle">approved</text>
<text class="dg-l" x="742" y="78" text-anchor="middle">delete approved</text>
<text class="dg-l" x="788" y="253" text-anchor="end">site removed,</text>
<text class="dg-l" x="788" y="266" text-anchor="end">fc_site cleared</text>
<circle cx="798" cy="284" r="8" fill="none" stroke="var(--k-line)" stroke-width="1.3"/><circle class="dg-dot" cx="798" cy="284" r="4.5"/>
</svg>
